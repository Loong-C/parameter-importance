# Stage 1 Pythia-14M 单卡训练与在线重要性验证的科学身份层。
# 本文件只声明离线资产 ID/hash；不会下载模型、数据或 tokenizer。
identity:
  stage: 1
  task: stage1.07_single_gpu_pythia14m
  route: pretrain
  run_intent: formal
  formal_eligible: true
runtime:
  environment_id: server-cuda-formal-v1
  dependency_profile: cuda-formal
  device: cuda
  output_root: runs/formal/stage1-pythia14m
  # Formalizer resolves this relative root under DATA_ROOT; keep it inside the
  # dedicated cache rather than an evidence or attempt directory.
  cache_root: cache
  temp_root: tmp/stage1-s1-7
  allow_dirty_worktree: false
model:
  asset_id: pythia-14m-step0
  revision: 56079904bb80b7f36d3b794089f146e7a4d6efae
  tokenizer_asset_id: pythia-tokenizer
  initialization_id: EleutherAI/pythia-14m@56079904bb80b7f36d3b794089f146e7a4d6efae:step0
  architecture: pythia-14m
data:
  asset_id: pile-selected-prefix
  revision: 4647773ea142ab1ff5694602fa104bbf49088408
  split: train
  sequence_length: 2048
  sampler: without_replacement_frozen_epoch
  statistical_unit: sequence
  weight_unit: effective_token
  sampling_design: without_replacement_frozen_epoch
  weights_exogenous: true
  common_mean_assumption: true
loss:
  task_type: causal_lm
  reduction: mean
  ignore_index: -100
  weighting: effective_token
batching:
  global_batch_size: 4
  per_device_batch_size: 1
  microbatch_size: 1
  accumulation_steps: 4
  no_sync: false
distributed:
  world_size: 1
  backend: local
  # The formalizer exposes exactly one approved UUID; 0 is logical cuda:0,
  # never a stable physical GPU index.
  device_ids: [0]
  timeout_seconds: 1800
precision:
  compute_dtype: float32
  gradient_dtype: float32
  statistic_dtype: float32
  reference_dtype: float64
  quadrature_weight_dtype: float64
  path_accumulation_dtype: float64
  amp: false
optimizer:
  type: adamw
  learning_rate: 0.0003
  momentum: 0.0
  weight_decay: 0.01
  fused: false
  foreach: false
  parameter_groups: []
importance:
  estimator_name: u
  # Stage 1 不在任务目录中声明消费未来 Stage 2 decision；runner 以 task catalog
  # formal_eligibility.requires_estimator_decision 为准，避免时间循环。
  estimator_decision_ref: null
  clip_mode: global_plugin
  accumulate_views: [signed, positive, negative_mass, absolute, raw, data_movement, net_data_movement, total_endpoint_movement, magnitude]
  require_decision_for_formal: true
